<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:400px; height:400px; overflow:hidden; }
  body {
    background:
      radial-gradient(120% 120% at 18% 12%, rgba(47,227,164,.18) 0%, rgba(10,15,30,0) 55%),
      radial-gradient(90% 90% at 85% 100%, rgba(47,227,164,.10) 0%, rgba(10,15,30,0) 60%),
      #0A0F1E;
    font-family: Georgia, 'Times New Roman', serif;
    color:#F2F6FF; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .grid { position:absolute; inset:0; opacity:.22;
    background-image:linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
  }
  .wrap { position:relative; text-align:center; }
  .mark { width:118px; height:118px; margin:0 auto 18px; display:block; }
  .word { font-size:56px; letter-spacing:-1.4px; line-height:1; }
  .word .k { color:#2FE3A4; }
  .rule { width:74px; height:3px; background:#2FE3A4; margin:18px auto 0; border-radius:2px; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="114" height="114" rx="26" stroke="#2FE3A4" stroke-width="3" opacity=".55"/>
      <path d="M30 78 L50 48 L70 64 L92 32" stroke="#2FE3A4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="78" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
      <circle cx="50" cy="48" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
      <circle cx="70" cy="64" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
      <circle cx="92" cy="32" r="8" fill="#2FE3A4"/>
    </svg>
    <div class="word">Flow<span class="k">Kit</span></div>
    <div class="rule"></div>
  </div>
</body></html>

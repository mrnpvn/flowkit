<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; }
  body {
    background:
      radial-gradient(70% 130% at 12% 10%, rgba(47,227,164,.20) 0%, rgba(10,15,30,0) 60%),
      radial-gradient(60% 110% at 95% 90%, rgba(47,227,164,.12) 0%, rgba(10,15,30,0) 65%),
      #0A0F1E;
    font-family: Georgia, 'Times New Roman', serif;
    color:#F2F6FF; position:relative;
  }
  .grid { position:absolute; inset:0; opacity:.20;
    background-image:linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px);
    background-size:50px 50px;
    mask-image:linear-gradient(100deg, #000 0%, transparent 62%);
    -webkit-mask-image:linear-gradient(100deg, #000 0%, transparent 62%);
  }
  .inner { position:relative; height:100%; display:flex; align-items:center; padding:0 84px 40px 210px; }
  .left { max-width:820px; }
  .brand { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
  .brand svg { width:44px; height:44px; }
  .name { font-size:34px; letter-spacing:-.5px; }
  .name .k { color:#2FE3A4; }
  h1 { font-size:60px; line-height:1.08; letter-spacing:-1.5px; font-weight:400; }
  h1 .g { color:#2FE3A4; }
  p.sub { margin-top:18px; font-family:'Segoe UI', Arial, sans-serif; font-size:20px; line-height:1.5; color:#AFC0DA; max-width:700px; }
  .pills { margin-top:26px; display:flex; gap:10px; font-family:'Segoe UI', Arial, sans-serif; font-size:14px; letter-spacing:.4px; text-transform:uppercase; color:#CFE3F5; }
  .pill { border:1px solid rgba(175,192,218,.35); padding:7px 13px; border-radius:999px; }
  .pill.on { border-color:rgba(47,227,164,.55); color:#2FE3A4; }
  .graph { position:absolute; right:70px; top:50%; transform:translateY(-50%); width:420px; height:340px; opacity:.9; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="inner">
    <div class="left">
      <div class="brand">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="114" height="114" rx="26" stroke="#2FE3A4" stroke-width="4" opacity=".6"/>
          <path d="M30 78 L50 48 L70 64 L92 32" stroke="#2FE3A4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="78" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
          <circle cx="50" cy="48" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
          <circle cx="70" cy="64" r="7" fill="#0A0F1E" stroke="#F2F6FF" stroke-width="3"/>
          <circle cx="92" cy="32" r="8" fill="#2FE3A4"/>
        </svg>
        <div class="name">Flow<span class="k">Kit</span></div>
      </div>
      <h1>Automatiza tu negocio.<br><span class="g">Sin código, sin cuotas.</span></h1>
      <p class="sub">Flujos n8n listos para importar: captación de leads, recordatorios de cita, plazos fiscales y verificación de cambios bancarios.</p>
      <div class="pills">
        <span class="pill on">Gratis</span>
        <span class="pill">MIT</span>
        <span class="pill">Self-hosted</span>
      </div>
    </div>
    <svg class="graph" viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 260 C120 250 130 120 210 110 C290 100 300 60 380 52" stroke="#2FE3A4" stroke-width="2" opacity=".55"/>
      <path d="M40 260 C130 290 190 210 250 220 C320 232 340 170 380 160" stroke="#AFC0DA" stroke-width="1.5" opacity=".28"/>
      <path d="M40 260 C110 200 170 170 210 110" stroke="#2FE3A4" stroke-width="1.5" opacity=".3"/>
      <g fill="#0A0F1E" stroke="#2FE3A4" stroke-width="2.5">
        <circle cx="40" cy="260" r="11"/><circle cx="130" cy="232" r="9"/><circle cx="210" cy="110" r="11"/>
        <circle cx="300" cy="72" r="9"/><circle cx="380" cy="52" r="12"/><circle cx="250" cy="220" r="9"/>
      </g>
      <circle cx="380" cy="52" r="5" fill="#2FE3A4"/>
      <g fill="#0A0F1E" stroke="#AFC0DA" stroke-width="2" opacity=".8">
        <circle cx="90" cy="120" r="7"/><circle cx="160" cy="290" r="7"/><circle cx="330" cy="270" r="7"/>
      </g>
    </svg>
  </div>
</body></html>
